  <text x="52" y="247" font-family="Arial,sans-serif" font-size="13" fill="#475569">⌁  Performance Analytics</text>
  <text x="52" y="289" font-family="Arial,sans-serif" font-size="13" fill="#475569">▧  View Full Report</text>
  <text x="52" y="331" font-family="Arial,sans-serif" font-size="13" fill="#475569">⚒  Central Diagnostics</text>
  <text x="25" y="382" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#0f172a">◆  Workspace</text>
