  <text x="944" y="701" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#2563eb">Explore performance trends  →</text>

  <text x="276" y="795" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">UPTRIX Website Monitor · Illustrative preview with sample data</text>
