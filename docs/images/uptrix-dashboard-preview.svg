  <text x="74" y="52" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#0f172a">UPTRIX</text>
  <text x="25" y="118" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">▣  Website Monitor</text>
