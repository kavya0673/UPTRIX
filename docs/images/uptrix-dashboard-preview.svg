  <text x="1163" y="330" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#64748b">AVERAGE RESPONSE</text><text x="1163" y="370" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#2563eb">113ms</text>

