    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#183153" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1440" height="920" fill="#f6f8fc"/>
  <rect width="245" height="920" fill="#ffffff"/>
  <path d="M245 0v920" stroke="#dbe3ef"/>

