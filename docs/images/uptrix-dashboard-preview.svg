  <rect x="944" y="516" width="384" height="12" rx="6" fill="#fee2e2"/><rect x="944" y="516" width="256" height="12" rx="6" fill="#10b981"/>
  <circle cx="950" cy="558" r="4" fill="#10b981"/><text x="962" y="562" font-family="Arial,sans-serif" font-size="11" fill="#64748b"><tspan font-weight="800" fill="#334155">2</tspan> operational</text>
  <circle cx="1156" cy="558" r="4" fill="#ef4444"/><text x="1168" y="562" font-family="Arial,sans-serif" font-size="11" fill="#64748b"><tspan font-weight="800" fill="#334155">1</tspan> needs attention</text>
  <text x="944" y="612" font-family="Arial,sans-serif" font-size="12" fill="#475569">2 of 3 sample websites are responding;</text>
  <text x="944" y="632" font-family="Arial,sans-serif" font-size="12" fill="#475569">1 needs attention.</text>
