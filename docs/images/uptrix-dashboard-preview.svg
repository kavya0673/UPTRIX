  <circle cx="326" cy="650" r="5" fill="#10b981"/><text x="340" y="654" font-family="Arial,sans-serif" font-size="12" fill="#334155">status.example.com</text><text x="847" y="654" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">UP · 84ms</text>
  <circle cx="326" cy="681" r="5" fill="#10b981"/><text x="340" y="685" font-family="Arial,sans-serif" font-size="12" fill="#334155">shop.example.org</text><text x="847" y="685" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">UP · 142ms</text>

