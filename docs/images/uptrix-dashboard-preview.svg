<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">UPTRIX Website Monitor dashboard preview</title>
  <desc id="desc">Illustrative overview dashboard with three sample websites, two operational sites, one site needing attention, and fleet health details.</desc>
  <defs>
